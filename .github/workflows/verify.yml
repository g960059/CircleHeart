name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject superseded repository paths
        run: npm run check:repository-hygiene

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  current-model:
    name: Current model registry admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify reviewed artifact, own captures and scientific bindings
        run: npm run verify:registry:current
      # Cold-to-periodic fitting belongs to the canonical/nightly lane. The PR
      # gate verifies current artifact/captures above and qualification rules here.
      - name: Verify pressure-rate numerical quality guards
        run: >-
          npx vitest run --config vitest.canonical.config.ts
          __tests__/mainWireBaselinePressureRateQualityV1.test.ts
          --minWorkers=1 --maxWorkers=2

  test:
    name: Fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pull-request smoke or full main suite
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:pr
          else
            npm run test:fast
          fi
        env:
          # Shared runners are markedly slower on the exact V3 hot-path and
          # session tests. Keep the 60 s local gate while allowing CI variance;
          # this remains a runaway-process guard rather than a performance gate.
          CIRCLEHEART_FAST_TEST_BUDGET_MS: 300000

  browser:
    name: Workbench browser smoke (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep one numerical test Worker per machine, but do not make all three
    # device/browser projects consume the same 15-minute job budget.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium, desktop-webkit]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        # Browser smoke must exercise the exact bundle committed by the PR.
        # A production-mode build resolves the already-active remote bundle,
        # which necessarily remains on the preceding release until this PR is
        # reviewed, merged, published, and activated.
        run: npm run build -- --mode test

      - name: Run desktop and mobile Workbench smoke
        run: npm run test:browser -- --project=${{ matrix.project }}
        env:
          # This build is deliberately browser-local, including save/reload tests.
          CIRCLEHEART_E2E_DIST: dist

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  public-content-browser:
    name: Public content browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Courses exercise configured Supabase contracts; registry and content are
      # intercepted locally while the Worker executes this commit's artifact.
      - run: npm run test:browser:public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-content-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  supabase:
    name: Supabase schema and policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Start local Supabase
        run: supabase start

      - name: Setup Node for authored-state succession regression
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify atomic authored-state migration and rollback
        run: CIRCLEHEART_TEST_SUCCESSOR_SQL=1 npx vitest run __tests__/authoredModelSuccessorV1.test.ts

      - name: Run database tests
        run: supabase test db --local supabase/tests/database

      - name: Lint local database
        run: >-
          supabase db lint --local
          --schema public,studio
          --level error
          --fail-on error

  whitespace:
    name: Check diff whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.sha }}^" "${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git diff --check "${{ github.sha }}^" "${{ github.sha }}"
          fi

  verify:
    name: Build, test, and verify
    runs-on: ubuntu-latest
    needs:
      - hygiene
      - build
      - browser
      - public-content-browser
      - supabase
      - current-model
      - test
      - whitespace
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check required jobs
        shell: bash
        env:
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          PUBLIC_CONTENT_BROWSER_RESULT: ${{ needs.public-content-browser.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
          CURRENT_MODEL_RESULT: ${{ needs.current-model.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WHITESPACE_RESULT: ${{ needs.whitespace.result }}
        run: |
          failed=0
          for item in \
            "Repository hygiene:$HYGIENE_RESULT" \
            "Build:$BUILD_RESULT" \
            "Workbench browser smoke:$BROWSER_RESULT" \
            "Public content browser smoke:$PUBLIC_CONTENT_BROWSER_RESULT" \
            "Supabase schema and policy tests:$SUPABASE_RESULT" \
            "Current model registry admission:$CURRENT_MODEL_RESULT" \
            "Test:$TEST_RESULT" \
            "Check diff whitespace:$WHITESPACE_RESULT"
          do
            name="${item%%:*}"
            result="${item#*:}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
